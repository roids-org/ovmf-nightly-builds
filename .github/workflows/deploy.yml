name: Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build OVMF for amd64
    runs-on: ubuntu-latest
    container: archlinux:latest
    
    permissions:
      contents: write
      packages: write
        
    steps:
      - name: Install dependencies
        run: | 
          pacman --noconfirm -Syu
          pacman --needed --noconfirm -S nodejs dpkg xz jq nasm base-devel gnupg tar gzip git curl llvm clang lld acpica

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout EDK2
        run: |
          git clone https://github.com/tianocore/edk2 --depth 1
          
      - name: Checkout EDK2 submodules
        run: |
          cd edk2
          git submodule update --init --jobs $(nproc)

      - name: Package release tarball
        run: |
          cd edk2
          . ./edksetup.sh

          THREADS=$(nproc)
          
          make -j$THREADS -C BaseTools

          build -b RELEASE -t CLANGPDB -a X64 -p OvmfPkg/OvmfPkgX64.dsc -n $THREADS
          
          cd ..
          
          mkdir ovmf-nightly
          cp edk2/Build/OvmfX64/RELEASE_CLANGPDB/FV/OVMF_CODE.fd ovmf-nightly/ovmf-code-amd64.fd
          cp edk2/Build/OvmfX64/RELEASE_CLANGPDB/FV/OVMF_VARS.fd ovmf-nightly/ovmf-vars-amd64.fd
          
          mkdir deploy
          tar -cvzf deploy/ovmf.tar.gz ovmf-nightly

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: "nightly"
          name: "Nightly build"
          files: deploy/ovmf.tar.gz
          body: |
            A nightly OVMF build from the CI.
